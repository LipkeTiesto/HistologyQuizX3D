<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Ring Gradient 1 -->
    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Core Glow Gradient -->
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Filter for subtle drop shadow and glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base for App Icon -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Subtle Microscopic Grid/Reticule Background -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(59, 130, 246, 0.08)" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(59, 130, 246, 0.12)" stroke-width="1.5"/>
  <line x1="256" y1="64" x2="256" y2="448" stroke="rgba(59, 130, 246, 0.08)" stroke-width="1.5" stroke-dasharray="6 8"/>
  <line x1="64" y1="256" x2="448" y2="256" stroke="rgba(59, 130, 246, 0.08)" stroke-width="1.5" stroke-dasharray="6 8"/>

  <!-- Outer Lens Reticule Bezel -->
  <circle cx="256" cy="256" r="116" fill="none" stroke="url(#cyanIndigo)" stroke-width="8" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="116" fill="none" stroke="url(#cyanIndigo)" stroke-width="6"/>

  <!-- 3D Target Reticle Notches -->
  <path d="M 256 122 L 256 142 M 256 370 L 256 390 M 122 256 L 142 256 M 370 256 L 390 256" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>

  <!-- Central Cellular Geometry / 3D Hexagon Matrix -->
  <g transform="translate(256, 256)">
    <!-- Hexagonal Cell 1 (Main Center) -->
    <polygon points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23" fill="rgba(14, 165, 233, 0.2)" stroke="url(#coreGlow)" stroke-width="4"/>
    
    <!-- Central Nucleus Glow -->
    <circle cx="0" cy="0" r="16" fill="url(#cyanIndigo)" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="12" fill="#FFFFFF"/>
    
    <!-- Chromatin Nodes -->
    <circle cx="-16" cy="-12" r="4" fill="#38BDF8"/>
    <circle cx="14" cy="-14" r="3.5" fill="#818CF8"/>
    <circle cx="16" cy="12" r="4" fill="#38BDF8"/>
    <circle cx="-12" cy="16" r="3" fill="#818CF8"/>

    <!-- 3D Isometric Projection Lines -->
    <path d="M 0 -46 L 0 -76 M 40 23 L 66 38 M -40 23 L -66 38" stroke="rgba(56, 189, 248, 0.5)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Satellite Hex Nodes -->
    <circle cx="0" cy="-76" r="5" fill="#38BDF8"/>
    <circle cx="66" cy="38" r="5" fill="#818CF8"/>
    <circle cx="-66" cy="38" r="5" fill="#38BDF8"/>
  </g>
</svg>

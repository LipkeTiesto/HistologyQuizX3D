<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HistoQuiz 3D — Інтерактивний практикум з гістології</title>

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0B0F19">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HistoQuiz">
    <meta name="description" content="Екзаменаційний тренажер та цифровий атлас з гістології, цитології та ембріології">

    <!-- Icons & Manifest -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <style>
        :root {
            --bg-base: #0B0F19;
            --bg-surface: #131926;
            --bg-elevated: #1C2436;
            --bg-input: #182030;
            
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-active: rgba(99, 102, 241, 0.5);
            
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --primary-light: #818CF8;
            --primary-glow: rgba(99, 102, 241, 0.18);
            
            --accent-cyan: #06B6D4;
            --accent-cyan-glow: rgba(6, 182, 212, 0.15);
            
            --success: #10B981;
            --success-bg: rgba(16, 185, 129, 0.12);
            --success-border: rgba(16, 185, 129, 0.35);
            
            --danger: #F43F5E;
            --danger-bg: rgba(244, 63, 94, 0.12);
            --danger-border: rgba(244, 63, 94, 0.35);
            
            --warning: #F59E0B;
            --warning-bg: rgba(245, 158, 11, 0.12);
            
            --text-main: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.25);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
            --shadow-lg: 0 12px 28px rgba(0,0,0,0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Bar */
        .app-bar {
            background: rgba(19, 25, 38, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            box-shadow: 0 0 12px var(--accent-cyan-glow);
            flex-shrink: 0;
        }

        .brand-text h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-tag {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 2px 6px;
            background: linear-gradient(135deg, var(--primary), var(--accent-cyan));
            border-radius: 4px;
            color: #FFFFFF;
        }

        .stats-strip {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-item {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            font-variant-numeric: tabular-nums;
        }

        .stat-item b {
            color: var(--text-main);
        }

        .stat-item.accuracy {
            color: var(--accent-cyan);
            border-color: rgba(6, 182, 212, 0.25);
            background: var(--accent-cyan-glow);
        }

        /* Main Layout */
        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            padding: 16px 20px 96px; /* bottom padding for sticky bar */
            max-width: 1240px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        @media (min-width: 992px) {
            .workspace-grid {
                grid-template-columns: 1.15fr 0.85fr;
                gap: 24px;
                padding: 24px 28px 40px;
            }
        }

        /* Segmented Mode Selector */
        .mode-segmented-bar {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 4px;
            border-radius: var(--radius-md);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-bottom: 16px;
        }

        .segment-tab {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 10px 12px;
            font-size: 13.5px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        .segment-tab:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.04);
        }

        .segment-tab.active {
            background: var(--primary);
            color: #FFFFFF;
            box-shadow: 0 2px 8px var(--primary-glow);
        }

        /* Filter Row */
        .filter-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            align-items: center;
            justify-content: space-between;
        }

        .select-custom {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s;
            cursor: pointer;
        }

        .select-custom:focus {
            border-color: var(--primary-light);
            color: var(--text-main);
        }

        .slide-counter-badge {
            font-size: 12px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        /* Microscope Stage Card */
        .microscope-stage {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-md);
            position: relative;
        }

        .stage-meta-header {
            padding: 10px 16px;
            background: rgba(11, 15, 25, 0.7);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pill-group {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .meta-pill {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.02em;
        }

        .meta-pill.system {
            background: rgba(79, 70, 229, 0.18);
            color: #A5B4FC;
            border: 1px solid rgba(79, 70, 229, 0.3);
        }

        .meta-pill.stain {
            background: rgba(6, 182, 212, 0.15);
            color: #67E8F9;
            border: 1px solid rgba(6, 182, 212, 0.3);
        }

        .meta-pill.source {
            background: rgba(245, 158, 11, 0.12);
            color: #FCD34D;
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        .stage-viewport {
            background: #020617;
            position: relative;
            min-height: 280px;
            max-height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            touch-action: pan-x pan-y;
        }

        .slide-canvas-wrap {
            position: relative;
            display: inline-block;
            max-width: 100%;
            max-height: 480px;
            transition: transform 0.2s ease;
        }

        .slide-image {
            display: block;
            max-width: 100%;
            max-height: 460px;
            object-fit: contain;
            border-radius: 4px;
            pointer-events: auto;
        }

        .stage-viewport.pointing-mode .slide-image {
            cursor: crosshair;
        }

        /* Marker & Target Ring */
        .tap-pulse-marker {
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 20;
            box-shadow: 0 0 16px rgba(0,0,0,0.8);
            border: 2px solid #FFFFFF;
        }

        .target-gold-ring {
            position: absolute;
            border-radius: 50%;
            border: 2.5px solid var(--warning);
            background: var(--warning-bg);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 15;
            animation: ringPulse 1.8s infinite ease-in-out;
        }

        @keyframes ringPulse {
            0% { transform: translate(-50%, -50%) scale(0.96); opacity: 0.9; }
            50% { transform: translate(-50%, -50%) scale(1.06); opacity: 0.4; }
            100% { transform: translate(-50%, -50%) scale(0.96); opacity: 0.9; }
        }

        /* Viewport floating zoom buttons */
        .stage-actions-bar {
            position: absolute;
            bottom: 12px;
            right: 12px;
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .zoom-btn {
            background: rgba(19, 25, 38, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .zoom-btn:hover {
            background: var(--bg-elevated);
            color: var(--primary-light);
        }

        /* Task & Question Panel */
        .interaction-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow-md);
        }

        .task-prompt-heading {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            line-height: 1.45;
        }

        /* Mode 1: Multiple Choice Grid */
        .options-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .option-tile {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            padding: 14px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            position: relative;
        }

        .option-tile:hover:not(.disabled) {
            border-color: var(--border-active);
            background: rgba(79, 70, 229, 0.08);
            transform: translateY(-1px);
        }

        .option-tile:active:not(.disabled) {
            transform: scale(0.99);
        }

        .option-tile.correct {
            border-color: var(--success-border) !important;
            background: var(--success-bg) !important;
            color: #34D399;
            font-weight: 600;
        }

        .option-tile.incorrect {
            border-color: var(--danger-border) !important;
            background: var(--danger-bg) !important;
            color: #FB7185;
        }

        .opt-token {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            flex-shrink: 0;
            border: 1px solid var(--border-subtle);
        }

        .option-tile.correct .opt-token {
            background: var(--success);
            color: #FFFFFF;
            border-color: var(--success);
        }

        .option-tile.incorrect .opt-token {
            background: var(--danger);
            color: #FFFFFF;
            border-color: var(--danger);
        }

        /* Mode 2: Search Autocomplete */
        .search-box-wrap {
            position: relative;
            margin-bottom: 12px;
        }

        .search-field {
            width: 100%;
            background: var(--bg-input);
            border: 1.5px solid var(--border-subtle);
            padding: 14px 16px 14px 44px;
            border-radius: var(--radius-md);
            font-size: 14.5px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        .search-field:focus {
            border-color: var(--primary-light);
            background: var(--bg-surface);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .search-icon-svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .autocomplete-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            max-height: 220px;
            overflow-y: auto;
            z-index: 50;
            display: none;
        }

        .autocomplete-row {
            padding: 11px 16px;
            font-size: 13.5px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .autocomplete-row:hover {
            background: rgba(99, 102, 241, 0.15);
            color: #FFFFFF;
        }

        .btn-action-primary {
            background: var(--primary);
            color: #FFFFFF;
            border: none;
            padding: 13px 20px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-action-primary:hover {
            background: var(--primary-hover);
        }

        .btn-action-primary:active {
            transform: scale(0.98);
        }

        /* Mode 3: Pointing Task Card */
        .pointing-card {
            background: rgba(6, 182, 212, 0.08);
            border: 1px solid rgba(6, 182, 212, 0.25);
            padding: 16px;
            border-radius: var(--radius-md);
            margin-bottom: 14px;
        }

        .hint-toggle-link {
            font-size: 12px;
            color: var(--accent-cyan);
            background: none;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
            font-weight: 600;
        }

        .hint-text-box {
            font-size: 12.5px;
            color: var(--text-secondary);
            margin-top: 8px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 6px;
            display: none;
            line-height: 1.45;
        }

        /* Explanation Drawer */
        .explanation-drawer {
            display: none;
            padding: 16px;
            border-radius: var(--radius-md);
            margin-top: 14px;
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .explanation-drawer.correct {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
        }

        .explanation-drawer.incorrect {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
        }

        .drawer-title {
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .drawer-body {
            font-size: 13.5px;
            line-height: 1.55;
            color: var(--text-main);
        }

        .distractor-breakdown {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            font-size: 12.5px;
            color: var(--text-secondary);
        }

        .distractor-breakdown ul {
            padding-left: 18px;
            margin-top: 6px;
        }

        .distractor-breakdown li {
            margin-bottom: 4px;
        }

        /* Bottom Controls (Mobile-first Sticky Navigation) */
        .bottom-nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(19, 25, 38, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-subtle);
            padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            z-index: 35;
        }

        .bottom-nav-inner {
            max-width: 1240px;
            width: 100%;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .btn-nav {
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav.secondary {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }

        .btn-nav.secondary:hover {
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-nav.primary {
            background: var(--primary);
            border: none;
            color: #FFFFFF;
            flex: 1;
            max-width: 220px;
            justify-content: center;
            box-shadow: 0 2px 10px var(--primary-glow);
        }

        .btn-nav.primary:hover {
            background: var(--primary-hover);
        }

        @media (min-width: 992px) {
            .bottom-nav-bar {
                position: static;
                background: transparent;
                backdrop-filter: none;
                border: none;
                padding: 16px 0 0;
            }
            .bottom-nav-inner {
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Brand Bar -->
    <header class="app-bar">
        <div class="brand-container">
            <img src="icon.svg" alt="HistoQuiz" class="brand-logo">
            <div class="brand-text">
                <h1>HistoQuiz <span class="brand-tag">3D Lab</span></h1>
            </div>
        </div>

        <div class="stats-strip">
            <div class="stat-item">
                <span>Пройдено:</span>
                <b id="statAnswered">0</b>
            </div>
            <div class="stat-item accuracy">
                <span>Точність:</span>
                <b id="statAccuracy">0%</b>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace-grid">

        <!-- Column 1: Microscope Stage Viewport -->
        <section class="left-column">
            <!-- Mode Segmented Control -->
            <div class="mode-segmented-bar" role="tablist">
                <button class="segment-tab active" id="tabMode1" onclick="switchMode(1)">
                    <span>📋</span> <span>1. Тест</span>
                </button>
                <button class="segment-tab" id="tabMode2" onclick="switchMode(2)">
                    <span>🔍</span> <span>2. Пошук</span>
                </button>
                <button class="segment-tab" id="tabMode3" onclick="switchMode(3)">
                    <span>🎯</span> <span>3. Вказівка</span>
                </button>
            </div>

            <!-- Filter Row -->
            <div class="filter-row">
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <select id="selectSystem" class="select-custom" onchange="applyFilters()">
                        <option value="all">Усі системи (All Systems)</option>
                        <option value="cytology">Цитологія та ембріологія</option>
                        <option value="epithelium">Епітелії та шкіра</option>
                        <option value="connective">Сполучні, хрящові та кісткові</option>
                        <option value="hematology">Кров та органи імунітету</option>
                        <option value="muscle">М'язові тканини</option>
                        <option value="nervous">Нервова система та органи чуття</option>
                        <option value="cardiovascular">Серцево-судинна система</option>
                        <option value="respiratory">Дихальна система</option>
                        <option value="digestive">Травна система та зуби</option>
                        <option value="urinary">Сечовидільна система</option>
                        <option value="endocrine">Ендокринна система</option>
                        <option value="reproductive">Статева система</option>
                    </select>

                    <select id="selectSource" class="select-custom" onchange="applyFilters()">
                        <option value="all">Усі колекції (All Folders)</option>
                        <option value="grabovyi">О.М. Грабовий</option>
                        <option value="savosko">С.І. Савосько</option>
                    </select>
                </div>

                <div class="slide-counter-badge">
                    <span id="slideIndex">1</span> / <span id="totalSlides">0</span>
                </div>
            </div>

            <!-- Microscope Stage Card -->
            <div class="microscope-stage">
                <div class="stage-meta-header">
                    <div class="pill-group">
                        <span class="meta-pill system" id="badgeSystem">Система</span>
                        <span class="meta-pill stain" id="badgeStain">Забарвлення</span>
                        <span class="meta-pill source" id="badgeSource">Кафедра</span>
                    </div>
                    <div style="font-size: 11px; color: var(--text-muted); font-family: ui-monospace, monospace;" id="slideFileName"></div>
                </div>

                <div class="stage-viewport" id="viewport">
                    <div class="slide-canvas-wrap" id="canvasWrap">
                        <img id="currentImage" class="slide-image" src="" alt="Гістологічний препарат" onclick="handleImageClick(event)">
                        <div id="tapMarker" class="tap-pulse-marker" style="display: none;"></div>
                        <div id="targetGoldRing" class="target-gold-ring" style="display: none;"></div>
                    </div>

                    <!-- Viewport Zoom Actions -->
                    <div class="stage-actions-bar">
                        <button class="zoom-btn" onclick="zoomImage(1.2)" title="Збільшити">+</button>
                        <button class="zoom-btn" onclick="zoomImage(0.8)" title="Зменшити">−</button>
                        <button class="zoom-btn" onclick="resetZoom()" title="Скинути масштаб">⟲</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Column 2: Quiz / Task Interaction Card -->
        <section class="right-column">
            <div class="interaction-card">
                <div id="taskContent">
                    <!-- Dynamic mode content injected here -->
                </div>

                <!-- Explanation Drawer -->
                <div id="explanationDrawer" class="explanation-drawer">
                    <div class="drawer-title" id="drawerTitle"></div>
                    <div class="drawer-body" id="drawerBody"></div>
                    <div id="distractorSection" class="distractor-breakdown" style="display: none;">
                        <b>Диференційна діагностика (аналіз дистракторів):</b>
                        <ul id="distractorList"></ul>
                    </div>
                </div>

                <!-- Navigation Controls (Desktop in card, Mobile sticky at bottom) -->
                <div class="bottom-nav-bar">
                    <div class="bottom-nav-inner">
                        <button class="btn-nav secondary" onclick="prevSlide()">◀ Назад</button>
                        <button class="btn-nav secondary" onclick="shuffleSlide()">🎲 Випадковий</button>
                        <button class="btn-nav primary" onclick="nextSlide()">Далі ▶</button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Load Slides Database -->
    <script src="slides_db.js"></script>

    <script>
        // State variables
        let currentMode = 1;
        let currentSlideIdx = 0;
        let filteredSlides = [];
        let score = { answered: 0, correct: 0 };
        let currentZoom = 1.0;

        function initApp() {
            filteredSlides = [...SLIDES_DB];
            document.getElementById('totalSlides').innerText = filteredSlides.length;
            loadSlide(0);
            registerServiceWorker();
        }

        // PWA Service Worker Registration
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js').then((reg) => {
                        console.log('HistoQuiz PWA ServiceWorker registered with scope:', reg.scope);
                    }).catch((err) => {
                        console.log('ServiceWorker registration error:', err);
                    });
                });
            }
        }

        // Mode Switching
        function switchMode(modeNum) {
            currentMode = modeNum;
            document.querySelectorAll('.segment-tab').forEach((tab, idx) => {
                tab.classList.toggle('active', idx + 1 === modeNum);
            });

            const viewport = document.getElementById('viewport');
            viewport.classList.toggle('pointing-mode', modeNum === 3);

            clearMarkers();
            renderModeUI();
        }

        // Filters
        function applyFilters() {
            const sys = document.getElementById('selectSystem').value;
            const src = document.getElementById('selectSource').value;

            filteredSlides = SLIDES_DB.filter(s => {
                const matchSys = (sys === 'all' || s.system === sys);
                const matchSrc = (src === 'all' || s.source === src);
                return matchSys && matchSrc;
            });

            document.getElementById('totalSlides').innerText = filteredSlides.length;
            if (filteredSlides.length === 0) {
                alert('Не знайдено препаратів за обраними критеріями.');
                return;
            }
            currentSlideIdx = 0;
            loadSlide(0);
        }

        // Load specific slide
        function loadSlide(idx) {
            if (idx < 0 || idx >= filteredSlides.length) return;
            currentSlideIdx = idx;
            document.getElementById('slideIndex').innerText = idx + 1;

            const slide = filteredSlides[idx];
            const img = document.getElementById('currentImage');
            img.src = encodeURI(slide.file);
            img.onerror = function() {
                this.alt = 'Помилка завантаження мікропрепарату';
            };

            document.getElementById('badgeSystem').innerText = slide.system_ua;
            document.getElementById('badgeStain').innerText = slide.stain;
            document.getElementById('badgeSource').innerText = slide.source_label;
            document.getElementById('slideFileName').innerText = slide.file.split('/').pop();

            resetZoom();
            clearMarkers();
            document.getElementById('explanationDrawer').style.display = 'none';

            renderModeUI();
        }

        function clearMarkers() {
            document.getElementById('tapMarker').style.display = 'none';
            document.getElementById('targetGoldRing').style.display = 'none';
        }

        // Render Interaction Card UI per Mode
        function renderModeUI() {
            const container = document.getElementById('taskContent');
            const slide = filteredSlides[currentSlideIdx];
            if (!slide) return;

            if (currentMode === 1) {
                // Mode 1: Multiple Choice
                let optionsHtml = '';
                slide.options.forEach((opt, oIdx) => {
                    const token = String.fromCharCode(65 + oIdx);
                    optionsHtml += `
                        <div class="option-tile" id="optTile-${oIdx}" onclick="handleMCSelect(${oIdx})">
                            <span class="opt-token">${token}</span>
                            <span>${opt}</span>
                        </div>
                    `;
                });

                container.innerHTML = `
                    <div class="task-prompt-heading">${slide.mc_question}</div>
                    <div class="options-stack">${optionsHtml}</div>
                `;
            } else if (currentMode === 2) {
                // Mode 2: Search Autocomplete
                container.innerHTML = `
                    <div class="task-prompt-heading">Введіть назву тканини, органа чи патології:</div>
                    <div class="search-box-wrap">
                        <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="searchInput" class="search-field" placeholder="Почніть вводити: Дно шлунку, Хрящ..." oninput="handleSearchInput(event)" autocomplete="off">
                        <div id="autoDropdown" class="autocomplete-dropdown"></div>
                    </div>
                    <button class="btn-action-primary" onclick="submitSearchName()">
                        <span>Перевірити відповідь</span>
                    </button>
                    <div style="font-size: 12px; color: var(--text-muted); margin-top: 10px;">
                        💡 <i>Підказка: Підтримується пошук за назвою органа українською та латиною.</i>
                    </div>
                `;
            } else if (currentMode === 3) {
                // Mode 3: Image Pointing
                container.innerHTML = `
                    <div class="pointing-card">
                        <div style="font-size: 14px; font-weight: 700; color: #FFFFFF; margin-bottom: 4px;">
                            ${slide.pointing_task.prompt}
                        </div>
                        <div style="font-size: 13px; color: var(--text-secondary);">
                            Торкніться або клацніть безпосередньо на мікропрепараті ліворуч у місці розташування цієї структури.
                        </div>
                        <div>
                            <button class="hint-toggle-link" onclick="toggleHint()">
                                <span>💡 Гістологічна підказка</span>
                            </button>
                            <div id="hintBox" class="hint-text-box">${slide.pointing_task.hint}</div>
                        </div>
                    </div>
                `;
            }
        }

        // Mode 1: Multiple choice handler
        function handleMCSelect(selectedIdx) {
            const slide = filteredSlides[currentSlideIdx];
            const isCorrect = (selectedIdx === slide.correct_idx);

            for (let i = 0; i < slide.options.length; i++) {
                const el = document.getElementById(`optTile-${i}`);
                if (el) {
                    el.classList.add('disabled');
                    if (i === slide.correct_idx) el.classList.add('correct');
                    else if (i === selectedIdx && !isCorrect) el.classList.add('incorrect');
                }
            }

            updateScore(isCorrect);
            showExplanation(
                isCorrect,
                isCorrect ? "✓ Правильно!" : "✕ Помилка!",
                slide.explanation,
                slide.distractors_explanations
            );
        }

        // Mode 2: Autocomplete input handler
        function handleSearchInput(e) {
            const val = e.target.value.trim().toLowerCase();
            const list = document.getElementById('autoDropdown');
            if (val.length < 1) { list.style.display = 'none'; return; }

            const matches = [];
            SLIDES_DB.forEach(s => {
                const searchKeys = [s.name_ua, s.name_lat, ...(s.synonyms || [])];
                const matched = searchKeys.some(k => k.toLowerCase().includes(val));
                if (matched && !matches.some(m => m.name === s.name_ua)) {
                    matches.push({ name: s.name_ua, sys: s.system_ua });
                }
            });

            if (matches.length === 0) { list.style.display = 'none'; return; }

            list.innerHTML = matches.slice(0, 6).map(m => `
                <div class="autocomplete-row" onclick="selectAutocomplete('${m.name.replace(/'/g, "\\'")}')">
                    <span>${m.name}</span>
                    <span style="font-size: 11px; color: var(--text-muted);">${m.sys}</span>
                </div>
            `).join('');
            list.style.display = 'block';
        }

        function selectAutocomplete(name) {
            const input = document.getElementById('searchInput');
            if (input) input.value = name;
            document.getElementById('autoDropdown').style.display = 'none';
        }

        function submitSearchName() {
            const input = document.getElementById('searchInput');
            if (!input) return;
            const userVal = input.value.trim().toLowerCase();
            const slide = filteredSlides[currentSlideIdx];

            const accepted = [slide.name_ua, slide.name_lat, ...(slide.synonyms || [])].map(s => s.toLowerCase());
            const isCorrect = accepted.some(acc => userVal.includes(acc) || (acc.includes(userVal) && userVal.length >= 3));

            updateScore(isCorrect);
            showExplanation(
                isCorrect,
                isCorrect ? `✓ Точно! Це: ${slide.name_ua}` : `✕ Помилка. Правильна назва: ${slide.name_ua}`,
                `<b>Препарат:</b> ${slide.name_ua} (<i>${slide.name_lat}</i>).<br><b>Забарвлення:</b> ${slide.stain}.<br>${slide.explanation}`,
                slide.distractors_explanations
            );
        }

        // Mode 3: Image tap/click location handler
        function handleImageClick(e) {
            if (currentMode !== 3) return;
            const img = document.getElementById('currentImage');
            const rect = img.getBoundingClientRect();

            // Percentage coordinates of click
            const clickX = ((e.clientX - rect.left) / rect.width) * 100;
            const clickY = ((e.clientY - rect.top) / rect.height) * 100;

            const slide = filteredSlides[currentSlideIdx];
            const pt = slide.pointing_task;

            // Helper to compute distance with aspect‑ratio correction
            const aspect = rect.width / rect.height; // >1 means wider than tall
            const distTo = (cx, cy, r) => {
                const dx = (clickX - cx) * aspect;
                const dy = clickY - cy;
                return Math.sqrt(dx * dx + dy * dy);
            };

            let isCorrect = false;
            let bestTarget = {x: pt.target_x, y: pt.target_y, r: pt.radius};
            let bestDist = distTo(pt.target_x, pt.target_y, pt.radius);
            // Primary target check
            if (bestDist <= pt.radius) isCorrect = true;

            // Additional targets (array of {x,y,r})
            if (Array.isArray(pt.targets)) {
                for (const t of pt.targets) {
                    const d = distTo(t.x, t.y, t.r);
                    if (d <= t.r) isCorrect = true;
                    if (d < bestDist) { bestDist = d; bestTarget = t; }
                }
            }

            // Zone / bounding box check (object {x1,y1,x2,y2})
            if (pt.zone) {
                const {x1, y1, x2, y2} = pt.zone;
                if (clickX >= x1 && clickX <= x2 && clickY >= y1 && clickY <= y2) {
                    isCorrect = true;
                    // For visual feedback highlight the valid clicked structure
                    bestTarget = {x: clickX, y: clickY, r: pt.radius || 15};
                }
            }

            // Display click marker
            const marker = document.getElementById('tapMarker');
            marker.style.left = `${clickX}%`;
            marker.style.top = `${clickY}%`;
            marker.style.background = isCorrect ? 'var(--success)' : 'var(--danger)';
            marker.style.boxShadow = isCorrect ? '0 0 16px var(--success)' : '0 0 16px var(--danger)';
            marker.style.display = 'block';

            // Reveal target ring (matches circular distance threshold)
            const ring = document.getElementById('targetGoldRing');
            ring.style.left = `${bestTarget.x}%`;
            ring.style.top = `${bestTarget.y}%`;
            const pixelRadius = (bestTarget.r / 100) * rect.height;
            ring.style.width = `${pixelRadius * 2}px`;
            ring.style.height = `${pixelRadius * 2}px`;
            ring.style.borderColor = isCorrect ? 'var(--success)' : 'var(--warning)';
            ring.style.display = 'block';

            updateScore(isCorrect);
            showExplanation(
                isCorrect,
                isCorrect ? "✓ Влучно! Структуру знайдено." : "✕ Спробуйте ще! Зверніть увагу на золоте коло:",
                `<b>${pt.prompt.replace('Клацніть на: ', '')}:</b> ${pt.structure_desc}`,
                null
            );
        }

        function toggleHint() {
            const h = document.getElementById('hintBox');
            if (h) h.style.display = (h.style.display === 'none' ? 'block' : 'none');
        }

        // Show Explanation Drawer
        function showExplanation(isCorrect, title, desc, distractors) {
            const drawer = document.getElementById('explanationDrawer');
            drawer.className = `explanation-drawer ${isCorrect ? 'correct' : 'incorrect'}`;
            document.getElementById('drawerTitle').innerHTML = title;
            document.getElementById('drawerBody').innerHTML = desc;

            const distSec = document.getElementById('distractorSection');
            const distList = document.getElementById('distractorList');
            if (distractors && distractors.length > 0) {
                distList.innerHTML = distractors.map(d => `<li>${d}</li>`).join('');
                distSec.style.display = 'block';
            } else {
                distSec.style.display = 'none';
            }
            drawer.style.display = 'block';
        }

        // Scoring
        function updateScore(isCorrect) {
            score.answered++;
            if (isCorrect) score.correct++;
            document.getElementById('statAnswered').innerText = score.answered;
            const pct = Math.round((score.correct / score.answered) * 100);
            document.getElementById('statAccuracy').innerText = `${pct}%`;
        }

        // Zoom functions
        function zoomImage(factor) {
            currentZoom *= factor;
            currentZoom = Math.min(Math.max(currentZoom, 0.7), 3.0);
            document.getElementById('canvasWrap').style.transform = `scale(${currentZoom})`;
        }

        function resetZoom() {
            currentZoom = 1.0;
            document.getElementById('canvasWrap').style.transform = 'scale(1)';
        }

        // Navigation controls
        function nextSlide() {
            const next = (currentSlideIdx + 1) % filteredSlides.length;
            loadSlide(next);
        }

        function prevSlide() {
            const prev = (currentSlideIdx - 1 + filteredSlides.length) % filteredSlides.length;
            loadSlide(prev);
        }

        function shuffleSlide() {
            const rand = Math.floor(Math.random() * filteredSlides.length);
            loadSlide(rand);
        }

        window.onload = initApp;
    </script>
</body>
</html>
